name: Sweep
options:
  bundleIdPrefix: com.sentechtipsvn
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.1"
    CURRENT_PROJECT_VERSION: "3"
    CODE_SIGNING_ALLOWED: NO
targets:
  Sweep:
    type: application
    platform: iOS
    sources:
      - path: Sweep
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sentechtipsvn.sweep
        INFOPLIST_FILE: Sweep/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SweepUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Sweep
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sentechtipsvn.sweep.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Sweep
schemes:
  Sweep:
    build:
      targets:
        Sweep: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
      targets: [SweepUITests]
