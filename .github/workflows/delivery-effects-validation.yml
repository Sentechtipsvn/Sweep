name: Sweep 0.7 effects and production Release validation
on:
  push:
    branches: ['feature/0.7.0-delivery-effects', 'verify/0.7.0-calendar-polish']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sweep-device-layout-${{ github.ref }}
  cancel-in-progress: true
jobs:
  device:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure Xcode and verify data
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          if [ '${{ github.ref_name }}' != 'verify/0.7.0-calendar-polish' ]; then swift test; fi
          brew install xcodegen
          xcodegen generate
      - name: Build device app and extension
        run: |
          set -o pipefail
          xcodebuild -project Sweep.xcodeproj -scheme Sweep -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | tee device-build.log
          python3 Tools/package_ipa.py --app build-device/Build/Products/Release-iphoneos/Sweep.app \
            --output dist/Sweep-0.7.0-build13.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Sweep-0.7.0-build13
          path: dist/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sweep-build13-symbols-and-log
          path: |
            build-device/Build/Products/Release-iphoneos/*.dSYM/
            device-build.log
          if-no-files-found: ignore
          retention-days: 90
  ui:
    name: iPhone 11 ${{ matrix.configuration }}
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration: ${{ fromJSON(github.ref_name == 'verify/0.7.0-calendar-polish' && '["Debug"]' || '["Debug","Release"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure Xcode and project
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          brew install xcodegen
          xcodegen generate
      - name: Create and boot iPhone 11
        timeout-minutes: 5
        run: |
          python3 -u - <<'PY'
          import subprocess,json,os
          data=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))
          runtime=next(key for key in data['devices'] if 'iOS-18-5' in key)
          device=subprocess.check_output(['xcrun','simctl','create','Sweep iPhone 11','com.apple.CoreSimulator.SimDeviceType.iPhone-11',runtime],text=True).strip()
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('SWEEP_TEST_SIMULATOR='+device+'\n')
          print('iPhone 11 simulator:',device,flush=True)
          subprocess.run(['xcrun','simctl','boot',device],check=True)
          subprocess.run(['xcrun','simctl','bootstatus',device,'-b'],check=True,timeout=240)
          PY
      - name: Generate a production ledger outside the app
        if: matrix.configuration == 'Release'
        run: |
          SWEEP_REPLAY_OUTPUT="$PWD/production-replay" swift test --filter ProductionReplayTests
      - name: Build and test
        timeout-minutes: 22
        env:
          SWEEP_TEST_CONFIGURATION: ${{ matrix.configuration }}
          SWEEP_CALENDAR_POLISH: ${{ github.ref_name == 'verify/0.7.0-calendar-polish' && '1' || '0' }}
        run: |
          set -o pipefail
          python3 -u - <<'PY' | tee device-ui.log
          import subprocess,os,shutil,signal
          from pathlib import Path
          configuration=os.environ['SWEEP_TEST_CONFIGURATION']; device=os.environ['SWEEP_TEST_SIMULATOR']
          base=['xcodebuild','-project','Sweep.xcodeproj','-scheme','Sweep','-configuration',configuration,
                '-destination','platform=iOS Simulator,id='+device,'-destination-timeout','60',
                '-derivedDataPath','build-ui','CODE_SIGNING_ALLOWED=NO','-parallel-testing-enabled','NO',
                '-test-timeouts-enabled','YES','-default-test-execution-time-allowance','180',
                '-maximum-test-execution-time-allowance','240']
          if configuration=='Release':
              # No DEBUG/SWEEP_TESTING flag, hidden data injector, or alternate app data root.
              subprocess.run(base+['build-for-testing'],check=True,timeout=700)
              app=Path('build-ui/Build/Products/Release-iphonesimulator/Sweep.app').resolve()
              subprocess.run(['xcrun','simctl','install',device,str(app)],check=True)
              container=Path(subprocess.check_output(['xcrun','simctl','get_app_container',device,'com.sentechtipsvn.sweep','data'],text=True).strip())
              target=container/'Library/Application Support/Delivery'
              shutil.copytree('production-replay',target,dirs_exist_ok=True)
              tests=['testProductionReleaseAttendanceNavigationAndRotation','testProductionReleaseDeliveryBranches']
              action='test-without-building'
          else:
              tests=['testAttendanceLargeTextNavigationUsesPlainScroll','testPaidOrderActionsExplainGuardAndCanReopenQR',
                     'testHotfixUnsignedBankOpensAfterSigningAndQRDoesNotRecordPayment',
                     'testHotfixPartialCashThenTransferNowPersistsOnlyConfirmedCash',
                     'testHotfixFreightConfirmationAndHorizontalImageButtons',
                     'testSharedImageReviewImportQRSetupAndRelaunch','testBillPreviewOCRImportAndRelaunch',
                     'testRecordedTransferStillDisplaysQRCode','testReportImageSelectionAndCompactTransferCaption',
                     'testReconciliationEmptyMonthHasNoFiguresFromAnotherMonth',
                     'testIntakeHasOnlyPhotoAndCameraSourcesAtLargeTextSize','testApprovedCashWorkflowAndNewTools',
                     'testUpdate02CompactContactsAndPlaces','testUpdate02AttendanceCalendarSavesAndPersists']
              action='test'
          if configuration=='Debug' and os.environ['SWEEP_CALENDAR_POLISH']!='1':
              unit=base.copy(); unit[4]='SweepFeedback'
              subprocess.run(unit+['-resultBundlePath','feedback-unit.xcresult','test'],check=True,timeout=700)
          if os.environ['SWEEP_CALENDAR_POLISH']=='1':
              tests=['testAttendanceLargeTextNavigationUsesPlainScroll','testUpdate02AttendanceCalendarSavesAndPersists']
          command=base+['-resultBundlePath','device-ui.xcresult']+['-only-testing:SweepUITests/SweepUITests/'+test for test in tests]+[action]
          result=subprocess.run(command,timeout=1000)
          if result.returncode: raise SystemExit(result.returncode)
          if configuration=='Release':
              recording=subprocess.Popen(['xcrun','simctl','io',device,'recordVideo','--codec=h264','effects.mp4'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              try:
                  effects=base+['-resultBundlePath','effects-ui.xcresult','-only-testing:SweepUITests/SweepUITests/testProductionZEffectsCashCompletionPersistsWithoutReplay','test-without-building']
                  result=subprocess.run(effects,timeout=240)
              finally:
                  recording.send_signal(signal.SIGINT)
                  try: recording.wait(timeout=20)
                  except subprocess.TimeoutExpired: recording.kill(); recording.wait()
              if result.returncode: raise SystemExit(result.returncode)
              subprocess.run(['xcrun','simctl','terminate',device,'com.sentechtipsvn.sweep'],capture_output=True)
              # XCTest may reinstall the app into a different data-container UUID.
              subprocess.run(['xcrun','simctl','install',device,str(app)],check=True)
              container=Path(subprocess.check_output(['xcrun','simctl','get_app_container',device,'com.sentechtipsvn.sweep','data'],text=True).strip())
              target=container/'Library/Application Support/Delivery'
              if target.exists(): shutil.rmtree(target)
              shutil.copytree('production-replay/ReadOnly',target)
              read_only=base+['-resultBundlePath','readonly-ui.xcresult',
                             '-only-testing:SweepUITests/SweepUITests/testProductionReadOnlyActionsGiveFeedbackAndStillClose',
                             'test-without-building']
              result=subprocess.run(read_only,timeout=180)
          raise SystemExit(result.returncode)
          PY
      - name: Export UI evidence
        if: always()
        run: |
          if [ -d device-ui.xcresult ]; then
            xcrun xcresulttool export attachments --path device-ui.xcresult --output-path screenshots || true
          fi
          if [ -d readonly-ui.xcresult ]; then
            xcrun xcresulttool export attachments --path readonly-ui.xcresult --output-path readonly-screenshots || true
          fi
          for pair in 'effects-ui.xcresult effects-screenshots' 'feedback-unit.xcresult unit-screenshots'; do
            set -- $pair
            if [ -d "$1" ]; then xcrun xcresulttool export attachments --path "$1" --output-path "$2" || true; fi
          done
          mkdir -p crash-reports
          find "$HOME/Library/Logs/DiagnosticReports" -name '*Sweep*' -exec cp {} crash-reports/ \; || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sweep-build13-${{ matrix.configuration }}-evidence
          path: |
            device-ui.log
            screenshots/
            readonly-screenshots/
            effects-screenshots/
            unit-screenshots/
            effects.mp4
            crash-reports/
          if-no-files-found: ignore
