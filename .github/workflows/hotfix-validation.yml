name: Sweep 0.6.1 device and Release checks
on:
  push:
    branches: ['fix/0.6.1-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sweep-hotfix-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Test data and backup compatibility
        run: swift test
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build device app and extension
        run: |
          set -o pipefail
          xcodebuild -project Sweep.xcodeproj -scheme Sweep -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | tee build.log
          python3 Tools/package_ipa.py --app build/Build/Products/Release-iphoneos/Sweep.app \
            --output dist/Sweep-0.6.1-build11.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Sweep-0.6.1-build11
          path: dist/
          retention-days: 14
      - name: Verify attendance in the optimized Release build
        run: |
          set -o pipefail
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for runtime,items in d["devices"].items() if "iOS-18-5" in runtime for x in items if x["name"] == "iPhone 16"))')
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcodebuild -project Sweep.xcodeproj -scheme Sweep -configuration Release \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath build-release-simulator \
            -resultBundlePath release-ui.xcresult CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 180 \
            -only-testing:SweepUITests/SweepUITests/testUpdate02AttendanceCalendarSavesAndPersists test | tee release-ui.log
      - name: Export test evidence
        if: always()
        run: |
          if [ -d release-ui.xcresult ]; then
            xcrun xcresulttool export attachments --path release-ui.xcresult --output-path release-screenshots || true
          fi
          mkdir -p crash-reports
          find "$HOME/Library/Logs/DiagnosticReports" -name '*Sweep*' -exec cp {} crash-reports/ \; || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sweep-hotfix-evidence
          path: |
            build.log
            release-ui.log
            release-screenshots/
            crash-reports/
          if-no-files-found: ignore
