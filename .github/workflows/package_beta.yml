name: Package Sweep beta
on:
  push:
    branches: [beta/package-0.2.0]
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Verify business rules and photo tools
        run: swift test
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build iPhone beta
        run: |
          set -o pipefail
          xcodebuild -project Sweep.xcodeproj -scheme Sweep -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | tee build.log
      - name: Package beta and record verification status
        run: |
          mkdir -p dist/Payload
          cp -R build/Build/Products/Release-iphoneos/Sweep.app dist/Payload/
          python3 - <<'PY'
          import plistlib,json
          from pathlib import Path
          p=plistlib.loads(Path('dist/Payload/Sweep.app/Info.plist').read_bytes())
          assert p['CFBundleIdentifier']=='com.sentechtipsvn.sweep'
          assert p['CFBundleShortVersionString']=='0.2.0'
          assert p['MinimumOSVersion']=='17.0'
          Path('dist/BUILD-INFO.json').write_text(json.dumps({k:p[k] for k in ['CFBundleIdentifier','CFBundleShortVersionString','CFBundleVersion','MinimumOSVersion']},indent=2))
          PY
          git rev-parse HEAD > dist/SOURCE-COMMIT.txt
          cat > dist/QA-STATUS.txt <<'TXT'
          Sweep 0.2.0 (2) — bản thử nghiệm, IPA chưa ký.
          Logic công đơn, tiền, lưu trữ và công cụ ảnh đã qua kiểm thử trong lượt đóng gói này.
          Kiểm thử giao diện và các thao tác Bill/iCloud/Zalo trên máy thật còn tiếp tục.
          Dùng một đơn mẫu để kiểm tra trước khi chuyển sổ chính sang Sweep.
          Cài bằng AltStore/công cụ ký phù hợp. Giữ cùng App ID; xuất sao lưu trước khi gỡ app có dữ liệu.
          TXT
          cd dist
          /usr/bin/zip -qr Sweep-0.2.0-beta-unsigned.ipa Payload
          shasum -a 256 Sweep-0.2.0-beta-unsigned.ipa > SHA256.txt
      - name: Upload phone-test beta
        uses: actions/upload-artifact@v4
        with:
          name: Sweep-0.2.0-beta-unsigned
          path: |
            dist/Sweep-0.2.0-beta-unsigned.ipa
            dist/SHA256.txt
            dist/BUILD-INFO.json
            dist/SOURCE-COMMIT.txt
            dist/QA-STATUS.txt
          retention-days: 14
      - name: Upload build failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Sweep-beta-build-log
          path: build.log
          if-no-files-found: ignore
